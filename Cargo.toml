[package]
name = "nddev-device-sync-updater"
version = "0.0.1-alpha.1"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
authors = ["NDDev OpenNetwork"]
homepage = "https://nddev.ai"
repository = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-updater"

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
nddev-device-sync-adapter-io = { version = "=0.0.1-alpha.4", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-agent", rev = "fba131111837ce1fe6c82ce6df9e3d19420f62e7" }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
